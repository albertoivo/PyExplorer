name: PR-Title

# Garante que títulos de PR seguem Conventional Commits
# Isso ajuda a gerar changelogs automáticos

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate:
    name: 📝 Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            O título do PR deve seguir Conventional Commits:
            
            Exemplos válidos:
            - feat: adiciona novo mundo de strings
            - fix: corrige bug no tutorial
            - docs: atualiza README
            - chore: atualiza dependências
