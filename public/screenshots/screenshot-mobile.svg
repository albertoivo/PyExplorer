<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
  </defs>
  
  <rect width="390" height="844" fill="url(#bg)"/>
  
  <!-- Status bar -->
  <rect x="0" y="0" width="390" height="44" fill="#0f0f1a"/>
  
  <!-- Header -->
  <rect x="0" y="44" width="390" height="56" fill="#1a1a2e"/>
  <text x="195" y="80" font-family="Arial" font-size="20" fill="#fff" text-anchor="middle">🐍 PyExplorer</text>
  
  <!-- Hero -->
  <text x="195" y="180" font-family="Arial" font-size="24" fill="#00ff88" text-anchor="middle">Aprenda Python</text>
  <text x="195" y="210" font-family="Arial" font-size="24" fill="#00ff88" text-anchor="middle">Jogando!</text>
  
  <!-- Stars counter -->
  <rect x="130" y="240" width="130" height="40" rx="20" fill="#2a2a3e" stroke="#ffd700" stroke-width="2"/>
  <text x="195" y="268" font-family="Arial" font-size="18" fill="#ffd700" text-anchor="middle">⭐ 150</text>
  
  <!-- World cards stacked -->
  <rect x="20" y="320" width="350" height="100" rx="16" fill="#2a2a3e" stroke="#00d9ff" stroke-width="2"/>
  <text x="70" y="380" font-family="Arial" font-size="32">🚀</text>
  <text x="120" y="365" font-family="Arial" font-size="16" fill="#fff">Primeiros Passos</text>
  <text x="120" y="390" font-family="Arial" font-size="12" fill="#a0aec0">Aprenda comandos básicos</text>
  
  <rect x="20" y="440" width="350" height="100" rx="16" fill="#2a2a3e" stroke="#9f7aea" stroke-width="2"/>
  <text x="70" y="500" font-family="Arial" font-size="32">🔢</text>
  <text x="120" y="485" font-family="Arial" font-size="16" fill="#fff">Números Mágicos</text>
  <text x="120" y="510" font-family="Arial" font-size="12" fill="#a0aec0">Faça cálculos incríveis</text>
  
  <rect x="20" y="560" width="350" height="100" rx="16" fill="#2a2a3e" stroke="#48bb78" stroke-width="2"/>
  <text x="70" y="620" font-family="Arial" font-size="32">📦</text>
  <text x="120" y="605" font-family="Arial" font-size="16" fill="#fff">Mundo das Variáveis</text>
  <text x="120" y="630" font-family="Arial" font-size="12" fill="#a0aec0">Guarde informações</text>
  
  <!-- Bottom nav -->
  <rect x="0" y="780" width="390" height="64" fill="#1a1a2e"/>
  <text x="78" y="820" font-family="Arial" font-size="12" fill="#667eea" text-anchor="middle">🎮 Jogar</text>
  <text x="195" y="820" font-family="Arial" font-size="12" fill="#a0aec0" text-anchor="middle">🏆 Recompensas</text>
  <text x="312" y="820" font-family="Arial" font-size="12" fill="#a0aec0" text-anchor="middle">👤 Perfil</text>
</svg>
